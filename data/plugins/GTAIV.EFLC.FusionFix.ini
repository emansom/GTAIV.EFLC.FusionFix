[MAIN]
RecoilFix = 1                                 // make recoil behavior the same as controller when playing with keyboard and mouse
AimingZoomFix = 1                             // -1: TBoGT aiming zoom behaves like IV and TLaD | 0: disable the fix | 1: TBoGT aiming zoom behaves like xbox feature | 2: have this feature also enabled in IV and TLaD

[CAMERASENSITIVITY]
MouseLookSensitivityRange = 0.1, 2.0          // min and max range for mouse look sensitivity slider
GamepadLookSensitivityRange = 0.1, 2.0        // min and max range for gamepad look sensitivity slider
MouseAimSensitivityRange = 0.1, 2.0           // min and max range for mouse aim sensitivity slider
GamepadAimSensitivityRange = 0.1, 2.0         // min and max range for gamepad aim sensitivity slider

[SHADOWS]
ExtraDynamicShadows = 2                       // adds back some missing shadows | 1: to some vegetation | 2: to some fences, grates, roads, walls and some vegetation
CascadeBlendSize = 0.1                        // controls the size of the cascade blending region | [0.0; 1.0]
HighResolutionShadows = 0                     // doubles cascaded shadow map resolution, very GPU intensive
ForceShadowFilter = 0                         // 0: blur quality tied to definition | 1: always use low quality | 2: always use high quality

[FRAMELIMIT]
FrameLimitType = 2                            // 1: realtime (thread-lock)  |  2: accurate (sleep-yield), uses less resources
FpsLimit = -2                                 // used when FPS Limit menu toggle is set to Custom (negative values use refresh rate as a base)
CutsceneFpsLimit = 0                          // custom FPS Limit value in cutscene
LoadingFpsLimit = 30                          // used to avoid game freeze on loading (e.g. Off Route mission)
UnlockFramerateDuringLoadscreens = 1          // game loads faster when using frame limiter
MinigamesFpsLimit = 30                        // used to avoid possible issues for specified minigames in MinigamesList
MinigamesList =                               pool_game, air_hockey, arm_wrestling, tenpinbowl, drinking

[MISC]
DefaultCameraAngleInTLaD = 1                  // enforces the default IV camera angle on bikes in TLaD
PedDeathAnimFixFromTBoGT = 1                  // disables the additional death animation performed after counter attacking peds in IV and TLaD, like in TBoGT
DisableCameraCenteringInCover = 1             // disables the forced camera centering after moving to the edge of a wall while in cover
ExtraInfo = 1                                 // shows extra info in the pause menu (e.g. loaded img files amount)
OverrideTreeAlpha = 0.0                       // set to e.g. 0.625, 2.5 or 4.0 for PC, PS3 or X360 tree alpha, respectively
ConsoleCarReflectionsAndDirt = 1              // use stronger console car reflections and any cars can be dirty when they are spawned like console
BrakeLightsWhenStopped = 0                    // lights the players brake lamps while stopped, like AI vehicles do (vanilla only lights them above walking pace)
FixHelicopterSearchlights = 1                 // 0: disabled, searchlights may flicker/fight each other | 1: only one searchlight can be active at a time (for max 10s) | 2: all searchlights can draw independently
AlwaysDisplayHealthOnReticle = 1              // allow game to display NPC health on the reticle when playing with keyboard and mouse
SmoothShorelines = 1                          // makes water edges smooth and adjusts foam noise
SmoothLightVolumes = 1                        // makes light volume edges smooth
NoBloomColorShift = 1                         // prevents bloom threshold from causing wild color shifts when tone mapping is enabled
MenuEnteringDelay = 0                         // 400:  default | 0: no delay
MenuExitingDelay = 0                          // 800:  default | 0: no delay
MenuAccessDelayOnStartup = 0                  // 3000: default | 0: no delay
RadarZoomDelay = 3000                         // 0:    default | 3000: 3s delay
DeathMusic = 0                                // plays cut death music when player is dead in IV
AutoClimbLaddersRange = 1.5                   // how close you must be to auto-climb, in units (the game uses 4.0 for a manual button press)

[FOG]
VolFogFarClip = 4500.0                        // override far clip for volumetric fog
ExtendedTimecycEditing = 0                    // 0: disabled | 1: display debug info and reload .dat with F3

[BudgetedIV]
VehicleBudget = 0                             // used to avoid "Taxi Bug", may cause vehicle audio issue
PedBudget = 0                                 // may cause issues
ExtendedLimits = 0                            // increases various limits like modelinfo, handling, carcols, some pools size

[EPISODICCONTENT]
EpisodicVehicles = 0                          // Support for APC, Buzzard, smuggler, floater, blade and all their abilities in IV and TLaD
EpisodicWeapons = 0                           // Support for DSR1, Grenade launcher, Pipe bomb, Sticky bomb, AA12 explosive shells, P90 vehicle check, Parachute and all their abilities in IV, TLaD and TBoGT
ExplosiveAnnihilator = 0                      // Enables explosive rounds on Annihilator in IV, requires ep weapons
OtherEpisodicChecks = 0                       // Support for Disco camera bobbing, Cell Phone switching, Altimeter in helicopters and parachute, Explosive sniper and fists cheat in IV and TLaD, requires related ep files
TBoGTHelicopterHeightLimit = 0                // Raises IV and TLaD height limit for helicopters to TBoGT level
TBoGTPoliceWeapons = 0                        // Gives P90 and AA12 to SWAT and FIB and M249 to police in helicopters in IV and TLaD. Requires ep weapons
RemoveSCOSignatureCheck = 0                   // Allows using any episodic SCO on all episodes
EpisodicDeathMusic = 0                        // Allows the restored death music to play in all episodes. Requires custom sound files added per-each episode for it to be unique.

[SUNSHAFTS]
SunShaftsDensity = 0.9                        // How long the rays are. [0.0; 1.0]
SunShaftsDecay = 0.95                         // How fast the rays fade out from the center. [0.0; 1.0]

[POSTFX]
EnablePreAlphaDepth = 1                       // Properly render depth related post-processing effects (e.g depth of field, sunshafts) through windows/transparent objects
AmbientOcclusionBlurPasses = 1
AmbientOcclusionSamples = 9
AmbientOcclusionLogMaxOffset = 3
AmbientOcclusionMaxMipLevel = 5
AmbientOcclusionFarClip = 150.0
AmbientOcclusionRadius = 1.125
AmbientOcclusionBias = 0.03
AmbientOcclusionIntensity = 0.4
AmbientOcclusionBlurRadius = 2.0

[SHADOWFILTERSHARP]                           // CE-like shadows
ShadowSoftness = 1.5                          // controls shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERSOFT]                            // 1.0.4.0-like shadows
ShadowSoftness = 3.0                          // controls shadow blur
ShadowBias = 8.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERCHSS]                            // CHSS / PCSS
ShadowSoftness = 1.5                          // controls minimum shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to minimum softness
MaxSoftness = 20.0                            // controls maximum shadow blur

[PROJECT2DFX]
CoronaRadiusMultiplier = 1.0                  // multiplier for corona radius
CoronaAlphaMultiplier = 1.0                   // multiplier for corona alpha
SlightlyIncreaseRadiusWithDistance = 1        // slight increase in corona radius with distance
DisableDefaultLodLights = 1                   // disable default distant lights

[TURNINDICATORS]
ManualTurnIndicators = 0                      // enable manual turn indicators, tap LB or RB on gamepad to activate
LeftIndicatorKey = 0xDB                       // VK_OEM_4, the Left Brace key
RightIndicatorKey = 0xDD                      // VK_OEM_6, the Right Brace key

[EXPERIMENTAL]
ReflectionMSAAQuality = 0                     // Applies MSAA to the reflection maps (exterior, interior, water, mirror) like on Xbox 360. Valid options: 2|4|8, other values are ignored and disable this feature.

[SHADERS]                                     // Launch-time shader / pipeline pre-compiler. Backend-agnostic (native D3D9 AND DXVK); runs on the session-start loading screen -- after the main menu and the episode/DLC menu, once you have started or loaded a game, at the point where RAGE has built its render phases and targets and every format, blend and write-mask the pipelines are keyed on can be READ from the engine instead of guessed. The game's own loading screen stays up, animated, and shows a progress bar and a line of text in its own style; nothing of ours is drawn behind it. Does NOT depend on Steam Fossilize or any driver/DXVK pipeline cache.
PrecompileShaders = 1                         // 1: create every shader and dummy-draw the render-state coverage set at launch (over the loading screen). 0: off.
PrecompileCoverage = 2                        // Coverage breadth vs launch time. 0 = create shaders only (removes the dominant DXVK stage-compile stutter). 1 = + one dummy draw per pass. 2 = + alpha-test/fog/clip spec-constant expansion (fullest coverage, default).
PrecompileOverlay = 1                         // 1: show a progress bar + ETA + current shader over the loading screen while compiling. 0: compile silently.
PrecompileCoverPresentModes = 1              // 1: also warm both A2B10G10R10 (10-bit) and A16B16G16R16F (fp16) present formats, in case the output format is switched at runtime. Harmless on stock SDR.
PrecompileCoverSdr = 0                        // 1: also warm the stock SDR scene formats (A8R8G8B8 / A2B10G10R10). The live RT/backbuffer formats are always covered automatically regardless.
PrecompileReplayCapturedKeys = 1              // 1: warm exactly the pipeline states the game really used instead of the synthetic coverage set. Sources: your own capture for this graphics configuration (FusionFix.pipelinecache.f<format>-ms<msaa>.bin, produced by CaptureDrawKeys -- per configuration because the keys contain render-target formats), the shipped FusionFix.pipelinecache.baseline.bin (so a first launch that has never captured anything still warms something), and every .bin file in plugins\d3d9cache\. That folder is how your PCs share: on each launch FusionFix copies this PC's own capture file(s) into it as FusionFix.<hash>.bin, named after the content so nothing ever needs renaming, and replaces its previous copy when the capture has grown. Copy the folder's files into plugins\d3d9cache\ on your other PCs and whatever was played on any of them is warm on all. Files go directly in the folder: subfolders are not read, and Vulkan .foz files belong in plugins\pipelinecache\. Any file name works, and the same content under two names is used once. Every file is checked before anything is built from it: older FusionFix formats are upgraded, keys recorded at other graphics settings are warmed where this PC can build them, keys naming shaders your install lacks (other mods) are skipped, and damaged or unknown files are skipped -- FusionFix.shaders.log has one line per file saying which. Files in plugins\d3d9cache\ are only read: never changed, moved, or merged into your own capture. Keys present in several sources are folded together. Falls back to the synthetic pass only when no source has keys. The game's own shaders are resolved by hash from your install's .fxc files; a file carries bytecode only for the shaders FusionFix builds at runtime, and that bytecode is only used from your own capture and the shipped baseline, never from another PC's file.
PrecompileAdaptiveExit = 0                    // DISABLED: the idea was to time the first 128 pipelines and stop when the driver is only fast-linking rather than compiling, so warming cannot pay for itself. It does not work -- DXVK does not block a draw call on pipeline compilation, it enqueues the work, so the draws measure ~0.07ms even with pipeline libraries switched OFF and compilation definitely happening. Leave at 0 until the check is based on a signal that reflects compilation rather than submission.
PrecompileFenceChunk = 1                      // How many pipelines to build between progress updates. DXVK queues Present onto the same thread that compiles pipelines, so the overlay can only refresh between compiles: 1 gives the smoothest bar, higher values finish marginally sooner with a visibly choppier one.
PrecompileSpecVariants = 1                    // The pass builds every distinct base pipeline first (shaders + vertex layout + blend/output state), then the variants that differ only in alpha test, fog, clip planes or sampler types. 1 (default): build both. 0: base pipelines only, which is all a driver that cannot fast-link (AMD on Windows is suspected) ever compiles synchronously; the variants only warm background work there.
PrecompileBudgetSeconds = 0                   // 0 (default): keep warming until every pipeline in the cache is compiled, however long that takes -- an unwarmed pipeline is a stutter during gameplay, which is worse than a longer load. Set a positive value only if you want loading time bounded; pipelines are warmed most-used-first, so a cap still leaves the ones that matter warm.
PrecompileEngineWarm = 0                      // Warm the pipelines the engine CAN draw, not only the ones somebody has already drawn. WHAT IT DOES: at the session-start loading screen it asks RAGE to build its render phases and targets (the engine's own code, its own object -- the engine then skips its own build), reads every render-target set, depth format, blend and colour-write vector out of those phases and out of the texture factory's registry of all ~73 render targets, and draws every effect PASS the game has loaded at every (render-target set, phase state, vertex layout, topology, sampler pattern) it can actually occur at, into private 64x64 targets in the engine's real formats, with the engine's own shader objects and per-pass render-state delta. WHAT IT COSTS, once per driver-cache generation (a fingerprint of the enumeration, the driver, the DXVK build and the installed shader set is kept beside the ASI; when it matches, a 512-job sample decides in a second or two whether the driver still has them, and a warm cache skips the rest -- the log says which path it took, and a measured repeat of a level-1 load took 7.0 s against 957 s for the first one): 0 = off (default). 1 "core", measured on this rig: 61191 jobs, 61081 pipelines, 33837 of them a real driver compile, 16 minutes of extra loading the first time. 2 "material" adds the sampler-binding variants, ~290k jobs, roughly an hour the first time -- this is the "warm everything" setting. 3 "wide" adds every render-target set any phase can bind; it costs hours and the measurement says it contains nothing level 2 + the recording does not, so it exists only to be measured. A hard cap of 400000 draws bounds all of them and the log says plainly when it is hit; PrecompileBudgetSeconds and PrecompileGateMaxSeconds still bound the load, and the work is ordered most-used-first so a cut sheds the speculative end. WHAT IT COVERS, scored against a 498-identity route trace with re/rage-shader-precompile/tools/warmspec.py: level 1 was EMITTED by this mod (PrecompileEmitLog) and scored from that emission -- 62.7 % of the identities the effect system can name, against 91.6 % for the recorded cache alone, and 92.8 % for the union of the two. Level 2's figures -- 70.8 % alone and 98.3 % of nameable identities / 99.1 % of draws in union with the recording -- are DERIVED, by expanding level 1's emission along the sampler-binding families the level adds; a full level-2 pass has never been emitted and scored end to end. Treat the level-2 union as a projection, not a measurement. WHY IT IS STILL OFF BY DEFAULT, in one number: the recorded cache on its own already covers 97.9 % of the route's DRAWS, and adding level 1 takes that to 99.1 % -- real, but 16 minutes of first load for the last 1.2 points, and no driven-route frame-time measurement of this build exists yet. Turn it on if you would rather spend the load than meet a compile in traffic. WHAT IT DOES NOT COVER, which is why PrecompileReplayCapturedKeys stays on: the (VS,PS) pairs that are not GTA IV's own shaders -- FusionFix's and other mods' -- which are 16 % of a route's identities and no engine table can name; anything drawn outside the effect system; and the last few material sampler patterns. The recorded cache remains the complement, not a fallback. Turns itself off with one log line if any engine address or table does not validate (another game build, EFLC, or a mod that moves the effect set), leaving the recorded replay untouched.
PrecompileWarmDevice = 1                      // Where PrecompileEngineWarm builds its pipelines, and the reason that setting is usable at all. WHY IT EXISTS: GTA IV is a 32-bit process and DXVK never gives a graphics pipeline back while the device that owns it lives -- DxvkPipelineManager's map is only ever inserted into, DxvkGraphicsPipeline::releasePipeline returns on its first line unless DxvkDevice::mustTrackPipelineLifetime(), that needs VK_EXT_graphics_pipeline_library on every branch and is refused for RADV anyway, and even when it does run it drops only the fast-linked base pipelines and keeps the optimized ones, which are the only kind this pass builds. A level-1 walk leaves about 61,000 live pipelines behind it, and on this rig that measured as ~760 MB of address space the game never gets back; two runs with the walk on died a minute or two into gameplay where the same binary, save and route drove clean without it. WHAT IT DOES: 1 (default) gives the walk a D3D9 device of its own -- the game's adapter, the game's behaviour flags, an 8x8 window that is never shown -- and destroys it when the walk is done. Destroying it is the one thing in DXVK that destroys a pipeline, so the address space comes back; what survives is the DRIVER's on-disk cache, which is keyed on the shader and the pipeline state rather than on the device, so the game's own device re-creates what it needs from disk in well under a millisecond. That is the same trick the Fossilize replay already uses when it creates a pipeline and destroys it in the next statement. 0: build them on the game's device, as before, with NO bound on how many -- this is the arm that killed the game, it exists only for A/B measurement, and it is the one value that has to be written out exactly to be reached. 2: diagnostic; try to create such a device at the gate, log what it cost and destroy it again -- the walk that follows still runs on the GAME's device, and like every other case where there is no device of our own it is bounded to 8192 jobs and to 192 MB of address space, with the log saying so. Anything that is not 0, 1 or 2 is read as 1 and logged. Whichever arm runs, the walk stops if free address space would fall below 1 GB.
PrecompileCrashLog = 0                        // Debugging only. 1: install a vectored exception handler and a hook on ExitProcess, so that whatever ends the process says so in FusionFix.shaders.log with the address, the faulting operand and the state of the 32-bit address space at that instant. It is what pinned the 2026-09-20 engine-warm deaths on an allocation rather than a fault: ExitProcess(3), zero exceptions of any kind before it, 1228 MB of address space free and 27 MB in the largest contiguous run. Off by default because with it installed the process SPINS instead of exiting once something has called ExitProcess -- four launches hung in teardown against none without it -- so it is worth having only while something is being chased.
PrecompileEmitLog = 0                         // Diagnostic / authoring. 1: write FusionFix.enginewarm.emitted.jsonl beside the ASI -- one line per pipeline identity the enumeration intends to build, in the fields re/rage-shader-precompile/tools/warmspec.py scores a corpus by, so containment can be measured against what the mod actually emits rather than a model of it. About 200 bytes a job, so tens of megabytes at level 1 and hundreds at level 2.
PrecompileSliceMs = 8                         // How many milliseconds of warming to do between the frames the game's own loading screen draws. The pass runs in slices on the loading-screen thread so the artwork keeps animating and the progress bar keeps moving; higher is faster and choppier, lower is smoother and slower. The loading screen draws at 64 fps, so 8 leaves it about half the thread.
PrecompileGateMaxSeconds = 0                  // 0 (default): hold the loading screen until the warm pass has finished, however long it takes -- an unwarmed pipeline is a stutter during gameplay and loading time is not. N > 0: after N seconds ask the pass to stop and unwind, and let the game start with whatever is warm.
PrecompileKeySampleCount = 0                  // Diagnostic. Whether D3DRS_MULTISAMPLEANTIALIAS is part of a warmed pipeline's identity. DXVK's source says it should be: BindRasterizerState turns it into DxvkRsInfo's sample count, that word is part of the pipeline state struct, and the struct is compared byte for byte -- so two draws differing only in it ought to be two pipelines and two compiles. Measured on this rig it is not: keying on it draws 1188 pipelines instead of 1093 and the driver finishes with the same 786 either way, so the 95 extra draws are loading time and nothing else (RADV has dynamic rasterization samples, which is the likeliest reason). 0 (default) leaves them out. 1 puts them back, which is how to re-test that on a driver without the extension without rebuilding.
PrecompileBootGate = 1                        // Where the warm pass runs. 1 (default): at the boot gate, on the return of the engine's own session start, in slices between the frames the game's loading screen draws -- the only place PrecompileEngineWarm can read the engine's render phases, and where the progress band is drawn into the game's own frame. 0: the older loading-screen gate, one blocking call on the first loading screen that presents its own frames; PrecompileEngineWarm then has no phases to read and falls back to the shipped stand-in table. This exists as the CONTROL arm for measuring the gate -- the two were previously only comparable by building two binaries, which is one more variable than the question needs. A build whose boot-gate addresses do not validate falls back to 0 on its own and says so.
PrecompileReuseWarmCache = 1                  // 1 (default): skip the long pass when the fingerprint beside the ASI matches this enumeration, this driver, this DXVK build and this shader set AND a 512-job sample shows the driver still has the pipelines. 0: always run the whole pass, which is what you want when measuring it.
PrecompileWarmMusic = 1                       // 1 (default): vary the music while the warm-up holds the game's own loading screen. The loading screen's music is six short layered stems the engine starts once and lets loop, which is fine for a 60-second load and wearing after twenty minutes. The rotation uses only music the game already has resident at this point in the boot and only the engine's own audio calls, so it is mixed on the same bus as the loading music it replaces and your music volume applies to it unchanged: the shipped loading stems, the pause / frontend menu music (MENU_MUSIC_STREAMED), all four of the game's continuous DJ mixes -- Electro-Choc, Massive B Soundsystem, The Classics and RamJam FM, the stations that are one long mix rather than a station with a DJ, adverts and a schedule -- the intro cutscene track and the end-credits theme, with the loading stems between them. About 45 minutes before anything is heard twice. Anything of ours is stopped before the loading screen comes down, and the engine's own loading music is handed back exactly as it was found. 0: leave the audio completely alone. Not in the rotation, and measured: the console install screen's arrangement (INSTALL_MUSIC_*) -- the sounds are defined but the PC build's LOADING wave bank holds none of their waves, and a run with it recorded silence for its whole slot.
PrecompileWarmMusicTracks =                   // Empty (default): the rotation above. Otherwise a comma-separated list that replaces it, each entry either LOADING or INSTALL (the engine's two six-stem sets) or the name of any sound the game's audio data defines, optionally followed by ":seconds" to cut it short -- e.g. "LOADING:120, MENU_MUSIC_STREAMED, RADIO_DANCE_MIX_FK:600". Without ":seconds" a track plays until it ends by itself, and nothing plays for longer than fifteen minutes whatever the list says: a track that LOOPS never ends by itself, and a measured run spent ten minutes on one because of it. A name is played through the RADIO3_A stream slot -- the one the game's own loading tune uses -- so radio tracks work the same way MENU_MUSIC_STREAMED does; a name the audio data does not define is logged and skipped and the next entry is tried, and if none of them will play the game's own loading music comes back rather than silence.
PrecompileFlashProbe = 0                      // Diagnostic. N > 0: clear the loading screen's render target to magenta every Nth frame, and log RT0's format and whether it is the back buffer. Answers whether an overlay drawn there can reach the screen at all. Leave at 0.
CaptureDrawKeys = 0                           // Diagnostic / authoring. 1: record the pipeline key of every D3D9 draw (shaders, vertex declaration, topology, RT+depth formats, render state, sampler types) to FusionFix.pipelinecache.f<format>-ms<msaa>.bin next to the .asi -- ONE file holding the keys, the vertex declarations they index, the bytecode of the shaders they name that no .fxc file supplies, and the provenance a merge tool needs (which shader directory the game resolved, adapter, driver, backend, OS). That single file is what you send in if you are contributing coverage, and what plugins\d3d9cache\ shares with your other PCs (see PrecompileReplayCapturedKeys). It holds only what the game drew on this PC: the loading-screen pass's own draws are not recorded, and files from other PCs are never merged into it. Costs frame time.
CaptureFlushSeconds = 10                      // How often a capture run writes its files, so killing the game still leaves usable data.
CaptureVulkanPipelines = 1                    // DXVK only. 1 (default): also record the Vulkan pipelines DXVK actually creates -- a level below the D3D9 keys above, including DXVK's own internal pipelines -- to FusionFix.vkpipelines.foz next to the .asi (a Fossilize database, the format Steam's shader pre-caching uses). Works with any DXVK on Windows and Proton; needs no Vulkan layer. It grows as you play and never records the same pipeline twice, nor the ones the loading-screen pass builds from other PCs' files in plugins\d3d9cache\. The file holds API-level pipeline descriptions (SPIR-V + state), not GPU code, so it is not tied to one GPU model. To share it: once per launch, before anything new is added, FusionFix copies it to plugins\pipelinecache\FusionFix.<content hash>.foz (and deletes the copy it wrote before; nothing else in that folder is touched). Copy the files in that folder to plugins\pipelinecache\ on your other PCs -- no renaming (see ReplayVulkanPipelinesForeign). Takes effect on the next launch.
ReplayVulkanPipelines = 1                     // DXVK only. 1 (default): warm the driver's shader cache with recorded Vulkan pipelines before gameplay needs them, on DXVK's own device; each pipeline is destroyed as soon as it is built. On the loading screen, in this order: the D3D9 pass (PrecompileShaders), a wait until DXVK has finished compiling everything that pass started, this PC's own FusionFix.vkpipelines.foz and then the files of ReplayVulkanPipelinesForeign on most of your CPU cores, and another such wait -- the loading screen is held until all of it is done (PrecompileBudgetSeconds still bounds it). With PrecompileShaders = 0 there is nothing to wait for and nothing is held: it runs in the background while the game loads. After a driver update this is what rebuilds the cache. Whatever these keys are set to, under DXVK FusionFix.shaders.log also reports gameplay frame times, stutters and every pipeline DXVK still had to compile during gameplay, every 15 seconds.
ReplayVulkanPipelinesForeign = 1              // DXVK only. 1 (default): also replay Fossilize databases this PC did not record with this DXVK build -- every .foz file directly in plugins\pipelinecache\, whatever its name (the FusionFix.<content hash>.foz copies from your other PCs; folders inside it are not read, and D3D9 .bin files belong in plugins\d3d9cache\), used once per content, so a copy of this PC's own file is skipped -- and your own Steam shader pre-cache for this game (read only, never written). They are replayed after this PC's own recording, with the loading screen held (see ReplayVulkanPipelines): the first launch with new files can take minutes, later ones seconds, because the driver's cache already has them. Every entry is checked first, as Steam's own replay does: it must be something DXVK uses on this PC, supported by your GPU and driver, and complete. Anything else is skipped, never built.
ReplayVulkanPipelinesTrace = 0                // Diagnostic. 1: log every foreign entry before it is replayed and why any was skipped.
PrecompileExportBaseline = 0                  // Authoring only. 1: after the replay works out which pipelines are actually distinct, write that deduplicated, most-used-first set to FusionFix.pipelinecache.baseline.export.bin, carrying only the shader bytecode those keys name plus the capture's provenance. That is the file to ship as the baseline (rename it to FusionFix.pipelinecache.baseline.bin) -- it is a fraction of a raw capture, because ~14000 recorded keys collapse to ~2000 real pipelines. Deliberately writes a DIFFERENT name from the one it reads, so a machine with this enabled never feeds its own output back in.
