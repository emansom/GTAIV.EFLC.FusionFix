[MAIN]
RecoilFix = 1                                 // make recoil behavior the same as controller when playing with keyboard and mouse
AimingZoomFix = 1                             // -1: TBoGT aiming zoom behaves like IV and TLaD | 0: disable the fix | 1: TBoGT aiming zoom behaves like xbox feature | 2: have this feature also enabled in IV and TLaD

[CAMERASENSITIVITY]
MouseLookSensitivityRange = 0.1, 2.0          // min and max range for mouse look sensitivity slider
GamepadLookSensitivityRange = 0.1, 2.0        // min and max range for gamepad look sensitivity slider
MouseAimSensitivityRange = 0.1, 2.0           // min and max range for mouse aim sensitivity slider
GamepadAimSensitivityRange = 0.1, 2.0         // min and max range for gamepad aim sensitivity slider

[SHADOWS]
ExtraDynamicShadows = 2                       // adds back some missing shadows | 1: to some vegetation | 2: to some fences, grates, roads, walls and some vegetation
CascadeBlendSize = 0.1                        // controls the size of the cascade blending region | [0.0; 1.0]
HighResolutionShadows = 0                     // doubles cascaded shadow map resolution, very GPU intensive
ForceShadowFilter = 0                         // 0: blur quality tied to definition | 1: always use low quality | 2: always use high quality

[FRAMELIMIT]
FrameLimitType = 2                            // 1: realtime (thread-lock)  |  2: accurate (sleep-yield), uses less resources
FpsLimit = -2                                 // used when FPS Limit menu toggle is set to Custom (negative values use refresh rate as a base)
CutsceneFpsLimit = 0                          // custom FPS Limit value in cutscene
LoadingFpsLimit = 30                          // used to avoid game freeze on loading (e.g. Off Route mission)
UnlockFramerateDuringLoadscreens = 1          // game loads faster when using frame limiter
MinigamesFpsLimit = 30                        // used to avoid possible issues for specified minigames in MinigamesList
MinigamesList =                               pool_game, air_hockey, arm_wrestling, tenpinbowl, drinking

[MISC]
DefaultCameraAngleInTLaD = 1                  // enforces the default IV camera angle on bikes in TLaD
PedDeathAnimFixFromTBoGT = 1                  // disables the additional death animation performed after counter attacking peds in IV and TLaD, like in TBoGT
DisableCameraCenteringInCover = 1             // disables the forced camera centering after moving to the edge of a wall while in cover
ExtraInfo = 1                                 // shows extra info in the pause menu (e.g. loaded img files amount)
OverrideTreeAlpha = 0.0                       // set to e.g. 0.625, 2.5 or 4.0 for PC, PS3 or X360 tree alpha, respectively
ConsoleCarReflectionsAndDirt = 1              // use stronger console car reflections and any cars can be dirty when they are spawned like console
BrakeLightsWhenStopped = 0                    // lights the players brake lamps while stopped, like AI vehicles do (vanilla only lights them above walking pace)
FixHelicopterSearchlights = 1                 // 0: disabled, searchlights may flicker/fight each other | 1: only one searchlight can be active at a time (for max 10s) | 2: all searchlights can draw independently
AlwaysDisplayHealthOnReticle = 1              // allow game to display NPC health on the reticle when playing with keyboard and mouse
SmoothShorelines = 1                          // makes water edges smooth and adjusts foam noise
SmoothLightVolumes = 1                        // makes light volume edges smooth
NoBloomColorShift = 1                         // prevents bloom threshold from causing wild color shifts when tone mapping is enabled
MenuEnteringDelay = 0                         // 400:  default | 0: no delay
MenuExitingDelay = 0                          // 800:  default | 0: no delay
MenuAccessDelayOnStartup = 0                  // 3000: default | 0: no delay
RadarZoomDelay = 3000                         // 0:    default | 3000: 3s delay
DeathMusic = 0                                // plays cut death music when player is dead in IV
AutoClimbLaddersRange = 1.5                   // how close you must be to auto-climb, in units (the game uses 4.0 for a manual button press)

[FOG]
VolFogFarClip = 4500.0                        // override far clip for volumetric fog
ExtendedTimecycEditing = 0                    // 0: disabled | 1: display debug info and reload .dat with F3

[BudgetedIV]
VehicleBudget = 0                             // used to avoid "Taxi Bug", may cause vehicle audio issue
PedBudget = 0                                 // may cause issues
ExtendedLimits = 0                            // increases various limits like modelinfo, handling, carcols, some pools size

[EPISODICCONTENT]
EpisodicVehicles = 0                          // Support for APC, Buzzard, smuggler, floater, blade and all their abilities in IV and TLaD
EpisodicWeapons = 0                           // Support for DSR1, Grenade launcher, Pipe bomb, Sticky bomb, AA12 explosive shells, P90 vehicle check, Parachute and all their abilities in IV, TLaD and TBoGT
ExplosiveAnnihilator = 0                      // Enables explosive rounds on Annihilator in IV, requires ep weapons
OtherEpisodicChecks = 0                       // Support for Disco camera bobbing, Cell Phone switching, Altimeter in helicopters and parachute, Explosive sniper and fists cheat in IV and TLaD, requires related ep files
TBoGTHelicopterHeightLimit = 0                // Raises IV and TLaD height limit for helicopters to TBoGT level
TBoGTPoliceWeapons = 0                        // Gives P90 and AA12 to SWAT and FIB and M249 to police in helicopters in IV and TLaD. Requires ep weapons
RemoveSCOSignatureCheck = 0                   // Allows using any episodic SCO on all episodes
EpisodicDeathMusic = 0                        // Allows the restored death music to play in all episodes. Requires custom sound files added per-each episode for it to be unique.

[SUNSHAFTS]
SunShaftsDensity = 0.9                        // How long the rays are. [0.0; 1.0]
SunShaftsDecay = 0.95                         // How fast the rays fade out from the center. [0.0; 1.0]

[POSTFX]
EnablePreAlphaDepth = 1                       // Properly render depth related post-processing effects (e.g depth of field, sunshafts) through windows/transparent objects
AmbientOcclusionBlurPasses = 1
AmbientOcclusionSamples = 9
AmbientOcclusionLogMaxOffset = 3
AmbientOcclusionMaxMipLevel = 5
AmbientOcclusionFarClip = 150.0
AmbientOcclusionRadius = 1.125
AmbientOcclusionBias = 0.03
AmbientOcclusionIntensity = 0.4
AmbientOcclusionBlurRadius = 2.0

[SHADOWFILTERSHARP]                           // CE-like shadows
ShadowSoftness = 1.5                          // controls shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERSOFT]                            // 1.0.4.0-like shadows
ShadowSoftness = 3.0                          // controls shadow blur
ShadowBias = 8.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERCHSS]                            // CHSS / PCSS
ShadowSoftness = 1.5                          // controls minimum shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to minimum softness
MaxSoftness = 20.0                            // controls maximum shadow blur

[PROJECT2DFX]
CoronaRadiusMultiplier = 1.0                  // multiplier for corona radius
CoronaAlphaMultiplier = 1.0                   // multiplier for corona alpha
SlightlyIncreaseRadiusWithDistance = 1        // slight increase in corona radius with distance
DisableDefaultLodLights = 1                   // disable default distant lights

[TURNINDICATORS]
ManualTurnIndicators = 0                      // enable manual turn indicators, tap LB or RB on gamepad to activate
LeftIndicatorKey = 0xDB                       // VK_OEM_4, the Left Brace key
RightIndicatorKey = 0xDD                      // VK_OEM_6, the Right Brace key

[EXPERIMENTAL]
ReflectionMSAAQuality = 0                     // Applies MSAA to the reflection maps (exterior, interior, water, mirror) like on Xbox 360. Valid options: 2|4|8, other values are ignored and disable this feature.

[SHADERS]                                     // Launch-time shader / pipeline pre-compiler. Backend-agnostic (native D3D9 AND DXVK); runs on the DLC/episode loading screen, before gameplay, so there is no in-game shader-compilation stutter. Does NOT depend on Steam Fossilize or any driver/DXVK pipeline cache.
PrecompileShaders = 1                         // 1: create every shader and dummy-draw the render-state coverage set at launch (over the loading screen). 0: off.
PrecompileCoverage = 2                        // Coverage breadth vs launch time. 0 = create shaders only (removes the dominant DXVK stage-compile stutter). 1 = + one dummy draw per pass. 2 = + alpha-test/fog/clip spec-constant expansion (fullest coverage, default).
PrecompileOverlay = 1                         // 1: show a progress bar + ETA + current shader over the loading screen while compiling. 0: compile silently.
PrecompileCoverPresentModes = 1              // 1: also warm both A2B10G10R10 (10-bit) and A16B16G16R16F (fp16) present formats, in case the output format is switched at runtime. Harmless on stock SDR.
PrecompileCoverSdr = 0                        // 1: also warm the stock SDR scene formats (A8R8G8B8 / A2B10G10R10). The live RT/backbuffer formats are always covered automatically regardless.
PrecompileReplayCapturedKeys = 1              // 1: warm exactly the pipeline states the game really used instead of the synthetic coverage set. Two sources are merged: your own capture for this graphics configuration (FusionFix.pipelinecache.f<format>-ms<msaa>.bin, produced by CaptureDrawKeys -- per configuration because the keys contain render-target formats) and the shipped FusionFix.pipelinecache.baseline.bin, so a first launch that has never captured anything still warms something. A third source: every cache file you put in plugins\pipelinecache\ -- copy your FusionFix.pipelinecache.f<format>-ms<msaa>.bin from your other PCs there, and everything played on any of them is warm on this one (with CaptureDrawKeys = 1 it is also merged into this PC's own file, so copying that file onward carries it all along). Keys present in several sources are folded together. Falls back to the synthetic pass only when none exists. The game's own shaders are resolved by hash from your install's .fxc files; a file carries bytecode only for the shaders FusionFix builds at runtime.
PrecompileAdaptiveExit = 0                    // DISABLED: the idea was to time the first 128 pipelines and stop when the driver is only fast-linking rather than compiling, so warming cannot pay for itself. It does not work -- DXVK does not block a draw call on pipeline compilation, it enqueues the work, so the draws measure ~0.07ms even with pipeline libraries switched OFF and compilation definitely happening. Leave at 0 until the check is based on a signal that reflects compilation rather than submission.
PrecompileFenceChunk = 1                      // How many pipelines to build between progress updates. DXVK queues Present onto the same thread that compiles pipelines, so the overlay can only refresh between compiles: 1 gives the smoothest bar, higher values finish marginally sooner with a visibly choppier one.
PrecompileSpecVariants = 1                    // The pass builds every distinct base pipeline first (shaders + vertex layout + blend/output state), then the variants that differ only in alpha test, fog, clip planes or sampler types. 1 (default): build both. 0: base pipelines only, which is all a driver that cannot fast-link (AMD on Windows is suspected) ever compiles synchronously; the variants only warm background work there.
PrecompileBudgetSeconds = 0                   // 0 (default): keep warming until every pipeline in the cache is compiled, however long that takes -- an unwarmed pipeline is a stutter during gameplay, which is worse than a longer load. Set a positive value only if you want loading time bounded; pipelines are warmed most-used-first, so a cap still leaves the ones that matter warm.
PrecompileFlashProbe = 0                      // Diagnostic. N > 0: clear the loading screen's render target to magenta every Nth frame, and log RT0's format and whether it is the back buffer. Answers whether an overlay drawn there can reach the screen at all. Leave at 0.
CaptureDrawKeys = 0                           // Diagnostic / authoring. 1: record the pipeline key of every D3D9 draw (shaders, vertex declaration, topology, RT+depth formats, render state, sampler types) to FusionFix.pipelinecache.f<format>-ms<msaa>.bin next to the .asi -- ONE file holding the keys, the vertex declarations they index, the bytecode of the shaders they name that no .fxc file supplies, and the provenance a merge tool needs (which shader directory the game resolved, adapter, driver, backend, OS). That single file is what you send in if you are contributing coverage. Costs frame time; set PrecompileShaders = 0 while capturing, or the precompiler's own synthetic draws are recorded as the game's.
CaptureFlushSeconds = 10                      // How often a capture run writes its files, so killing the game still leaves usable data.
CaptureVulkanPipelines = 0                    // 1: also record the Vulkan pipelines DXVK actually creates -- a level below the D3D9 keys above, including DXVK's own internal pipelines -- to FusionFix.vkpipelines.foz next to the .asi (a Fossilize database, the format Steam's shader pre-caching uses). Works with any DXVK on Windows and Proton; needs no Vulkan layer. The file holds API-level pipeline descriptions (SPIR-V + state), not GPU code, so it is not tied to one GPU model: it helps any machine whose DXVK build and Vulkan driver/feature set make DXVK produce the same pipelines (e.g. another card of the same family on the same driver). Takes effect on the next launch.
PrecompileExportBaseline = 0                  // Authoring only. 1: after the replay works out which pipelines are actually distinct, write that deduplicated, most-used-first set to FusionFix.pipelinecache.baseline.export.bin, carrying only the shader bytecode those keys name plus the capture's provenance. That is the file to ship as the baseline (rename it to FusionFix.pipelinecache.baseline.bin) -- it is a fraction of a raw capture, because ~14000 recorded keys collapse to ~2000 real pipelines. Deliberately writes a DIFFERENT name from the one it reads, so a machine with this enabled never feeds its own output back in.
