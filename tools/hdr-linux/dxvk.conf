# (Remove this marker line if you want to hand-customize without being clobbered.)
#
# dxvk-hdr-mingw — example dxvk.conf for HDR uplift across all DXVK D3D versions.
#
# HDR-mod scopes swapchain options PER-API: d3d9.* affects D3D9 games (GTA IV,
# Bioshock, NFS Most Wanted etc.) and dxgi.* affects D3D10/11/12 games. Both
# blocks are included below so the same dxvk.conf works regardless of which
# D3D version the game uses. Unused options are no-ops.
#
# Reference for every option: /usr/share/doc/dxvk-hdr-mingw/HDR-mod.md

# --- D3D9 swapchain (D3D9 titles: GTA IV, Bioshock, NFS Most Wanted, etc) ---
# FusionFix native HDR10: BT.2020 PQ container, 10-bit.
#
# upgradeSwapChainColorSpaceTo is REQUIRED. d3d9_options.cpp does:
#   if (upgradeSwapChainFormatTo     == VK_FORMAT_UNDEFINED
#    || upgradeSwapChainColorSpaceTo == VK_COLOR_SPACE_MAX_ENUM_KHR)
#       enableSwapChainUpgrade = false;
# so omitting it silently disables the WHOLE upgrade - 8-bit sRGB, no HDR, and
# nothing louder than an info-level "swap chain upgrade disabled".
#
# Do not try to move these into $DXVK_CONFIG: Proton's protonfixes writes that
# variable itself (for DXVK_FRAME_RATE) and ours does not survive. This file is
# read reliably - GTAIV_d3d9.log confirms "Found config file: dxvk.conf".
#
# To go back to the old scRGB + PumboAutoHDR setup, restore dxvk.conf.pre-hdr10-bak.
d3d9.enableSwapChainUpgrade        = True
d3d9.upgradeSwapChainFormatTo      = rgb10a2_unorm
d3d9.upgradeSwapChainColorSpaceTo  = PQ
d3d9.enableBackBufferUpgrade       = True
d3d9.upgradeBackBufferTo           = rgba16_sfloat

# --- D3D9 internal render-target uplift --------------------------------------
d3d9.enableRenderTargetUpgrades             = True
d3d9.upgrade_RGBA8_UNORM_renderTargetTo     = rgba16_sfloat
d3d9.upgrade_RGBX8_UNORM_renderTargetTo     = rgba16_sfloat
d3d9.upgrade_BGRA8_UNORM_renderTargetTo     = rgba16_sfloat
d3d9.upgrade_BGRX8_UNORM_renderTargetTo     = rgba16_sfloat
d3d9.upgrade_RGB10A2_UNORM_renderTargetTo   = rgba16_sfloat
d3d9.upgrade_BGR10A2_UNORM_renderTargetTo   = rgba16_sfloat

# --- DXGI swapchain (D3D10/11/12 titles via DXVK) ----------------------------
dxgi.enableSwapChainUpgrade        = True
dxgi.upgradeSwapChainFormatTo      = rgba16_sfloat
dxgi.upgradeSwapChainColorSpaceTo  = scRGB

# --- D3D11 internal render-target uplift -------------------------------------
d3d11.enableRenderTargetUpgrades            = True
d3d11.upgrade_RGBA8_UNORM_renderTargetTo    = rgba16_sfloat
d3d11.upgrade_RGBA8_UNORM_SRGB_renderTargetTo  = rgba16_sfloat
d3d11.upgrade_BGRA8_UNORM_renderTargetTo    = rgba16_sfloat
d3d11.upgrade_BGRA8_UNORM_SRGB_renderTargetTo  = rgba16_sfloat

# --- Diagnostics (uncomment if HDR uplift looks wrong) -----------------------
# d3d9.logRenderTargetFormatsUsed   = True
# d3d11.logRenderTargetFormatsUsed  = True
# d3d11.logViewsOfRenderTargets     = True

# --- Declared HDR metadata (added for absolute-luminance HDR) ----------------
# Marker line removed on purpose: this file is now hand-maintained, so
# dxvk-hdr-steam-wrap will not overwrite it. Values match the PumboAutoHDR
# preset (HDR_PEAK_WHITE=400, OUTPUT_WHITE_LEVEL_NITS=203).
#
# MaxFALL is a representative figure, not a measurement: the largest frame
# average over a session is not knowable in advance and a game has no end.
# Measured gameplay runs 12-70 nits depending on the scene, so 100 sits above
# what the content reaches without claiming anything near the peak. KWin
# receives this value and never uses it -- it appears in the protocol handlers,
# the ColorDescription model and the DRM output's own EDID capability, but
# nowhere in src/scene, src/opengl or src/effect, so the tonemapper keys off the
# mastering maximum alone. Setting it to 0 would NOT declare "unknown": the
# hdr-metadata-defaults patch falls back to MaxCLL when the option is <= 0.
dxvk.hdrMasteringMinLuminance     = 0.0
dxvk.hdrMasteringMaxLuminance     = 400.0
dxvk.hdrMaxContentLightLevel      = 400.0
dxvk.hdrMaxFrameAverageLightLevel = 100.0
